services:
  emarket-api-mock:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: emarket-api-mock

    ports:
      - "8090:8080"

    command:
      - "--verbose"
      - "--local-response-templating"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost:8080/__admin/health
      interval: 15s
      timeout: 5s
      retries: 3

    networks:
      - emarket-network

networks:
  emarket-network:
    external: true
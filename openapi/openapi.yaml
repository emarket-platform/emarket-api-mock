# Это начальная спецификация. В дальнейшем нужно синхронизировать её с реальными mappings.
openapi: 3.0.3

info:
  title: emarket API
  description: API specification for emarket-platform
  version: 1.0.0

servers:
  - url: http://localhost:8090
    description: Local WireMock

tags:
  - name: Users
  - name: Products
  - name: Authentication

paths:
  /api/v1/web/users/me:
    get:
      tags:
        - Users
      summary: Get current user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user profile

  /api/v1/web/products:
    get:
      tags:
        - Products
      summary: Get products
      operationId: getProducts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Product list

  /api/v1/web/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Authentication successful
